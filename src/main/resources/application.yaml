spring:
  application:
    name: kopic-ge
  profiles:
    default: local

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

kopic:
  node-id: ${KOPIC_NODE_ID:ge-local}
  game-timer:
    close-if-empty: ${KOPIC_GAME_TIMER_CLOSE_IF_EMPTY:30s}
    start-round: ${KOPIC_GAME_TIMER_START_ROUND:3s}
    next-turn: ${KOPIC_GAME_TIMER_NEXT_TURN:3s}
    open-word-choice: ${KOPIC_GAME_TIMER_OPEN_WORD_CHOICE:3s}
    turn-result: ${KOPIC_GAME_TIMER_TURN_RESULT:7s}
    game-result: ${KOPIC_GAME_TIMER_GAME_RESULT:10s}
    quick-restart: ${KOPIC_GAME_TIMER_QUICK_RESTART:5s}
  rabbit:
    outbound-exchange: ${KOPIC_RABBIT_OUTBOUND_EXCHANGE:kopic.ws.exchange}
    inbound-queue-prefix: ${KOPIC_RABBIT_INBOUND_QUEUE_PREFIX:kopic.ge.event.}
    inbound-routing-key-prefix: ${KOPIC_RABBIT_INBOUND_ROUTING_KEY_PREFIX:kopic.ge.route.}
    outbound-routing-key-prefix: ${KOPIC_RABBIT_OUTBOUND_ROUTING_KEY_PREFIX:kopic.ws.route.}

