server:
  shutdown: graceful

spring:
  application:
    name: kopic-ge
  lifecycle:
    timeout-per-shutdown-phase: ${KOPIC_SHUTDOWN_PHASE_TIMEOUT:70m}
  profiles:
    default: local
  data:
    redis:
      host: ${KOPIC_REDIS_HOST:localhost}
      port: ${KOPIC_REDIS_PORT:6379}
      password: ${KOPIC_REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

kopic:
  node-id: ${KOPIC_NODE_ID:ge-local}
  redis:
    enabled: ${KOPIC_REDIS_ENABLED:true}
    heartbeat-ttl: ${KOPIC_REDIS_HEARTBEAT_TTL:15s}
    room-code-ttl: ${KOPIC_REDIS_ROOM_CODE_TTL:6h}
    heartbeat-interval: ${KOPIC_REDIS_HEARTBEAT_INTERVAL:10s}
    load-interval: ${KOPIC_REDIS_LOAD_INTERVAL:1m}
    reconciliation-interval: ${KOPIC_REDIS_RECONCILIATION_INTERVAL:1h}
    initial-delay: ${KOPIC_REDIS_INITIAL_DELAY:2s}
    room-weight: ${KOPIC_REDIS_ROOM_WEIGHT:2.0}
    keys:
      ge-prefix: ${KOPIC_REDIS_KEY_GE_PREFIX:ge:}
      ge-load: ${KOPIC_REDIS_KEY_GE_LOAD:ge:load}
      quick-available: ${KOPIC_REDIS_KEY_QUICK_AVAILABLE:quick:available}
      room-code-prefix: ${KOPIC_REDIS_KEY_ROOM_CODE_PREFIX:roomcode:}
  game-timer:
    close-if-empty: ${KOPIC_GAME_TIMER_CLOSE_IF_EMPTY:30s}
    start-round: ${KOPIC_GAME_TIMER_START_ROUND:3s}
    next-turn: ${KOPIC_GAME_TIMER_NEXT_TURN:3s}
    open-word-choice: ${KOPIC_GAME_TIMER_OPEN_WORD_CHOICE:3s}
    turn-result: ${KOPIC_GAME_TIMER_TURN_RESULT:7s}
    game-result: ${KOPIC_GAME_TIMER_GAME_RESULT:10s}
    quick-restart: ${KOPIC_GAME_TIMER_QUICK_RESTART:5s}
  rabbit:
    outbound-exchange: ${KOPIC_RABBIT_OUTBOUND_EXCHANGE:kopic.ws.exchange}
    inbound-queue-prefix: ${KOPIC_RABBIT_INBOUND_QUEUE_PREFIX:kopic.ge.event.}
    inbound-routing-key-prefix: ${KOPIC_RABBIT_INBOUND_ROUTING_KEY_PREFIX:kopic.ge.route.}
    outbound-routing-key-prefix: ${KOPIC_RABBIT_OUTBOUND_ROUTING_KEY_PREFIX:kopic.ws.route.}
